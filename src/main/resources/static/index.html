<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chamada — Grande Coral</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">

  <header>
    <div>
      <div class="titulo">Chamada — Grande Coral</div>
      <div class="linha-data">
        <label for="data">Ensaio:</label>
        <input type="date" id="data">
      </div>
    </div>
    <div class="badge">
      <b id="badge-total">0</b>
      <span>PRESENTES</span>
    </div>
  </header>

  <div id="mensagem"></div>

  <div class="rotulo-secao">CONGREGAÇÕES</div>
  <div id="lista-congregacoes">
    <div class="carregando">Carregando congregações…</div>
  </div>

  <div class="rotulo-secao">MAESTROS</div>
  <div id="lista-maestros"></div>

  <div class="rotulo-secao">DIRIGENTES</div>
  <div id="lista-dirigentes"></div>

</div>

<footer>
  <div class="footer-inner">
    <div class="resumo">
      Adolescentes: <b id="r-ado">0</b> &nbsp;|&nbsp;
      Jovens: <b id="r-jov">0</b> &nbsp;|&nbsp;
      Maestros: <b id="r-mae">0/0</b> &nbsp;|&nbsp;
      Dirigentes: <b id="r-dir">0/0</b>
    </div>
    <button class="salvar" id="btn-salvar">Salvar chamada</button>
  </div>
</footer>

<script src="js/app.js"></script>
</body>
</html>
